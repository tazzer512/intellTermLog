name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux only: the plugin (and its tests) need bash, a PTY and /proc.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and the downloaded IntelliJ IDEA, so later runs skip the ~1.5 GB download.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build plugin
        run: ./gradlew test buildPlugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: log-console-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
